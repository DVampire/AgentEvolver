<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Benchmark · Live</title>
  <link rel="stylesheet" href="/benchmark.css">
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">AgentEvolver · Live Evaluation</p><h1 id="title">Benchmark</h1><p id="run-id">连接中…</p></div><div class="health"><i id="health-dot"></i><div><b id="health">连接中</b><small id="updated">—</small></div></div></header>
    <section class="summary">
      <article><label>整体进度</label><strong><span id="completed">—</span><small id="total">/ —</small></strong><div class="track"><i id="progress"></i></div><p><span id="percent">—</span><span id="eta">—</span></p></article>
      <article><label>当前得分</label><strong id="score">—</strong><p><span class="pass"><b id="passed">—</b> passed</span><span class="fail"><b id="failed">—</b> failed</span><span class="warn"><b id="errors">—</b> errors</span></p></article>
      <article><label>运行状态</label><strong id="elapsed">—</strong><p><span><b id="active-count">—</b> / <b id="concurrency">—</b> 活跃</span><span id="pid">PID —</span></p></article>
    </section>
    <section class="grid">
      <article class="panel workers"><div class="panel-head"><div><p class="eyebrow">Workers</p><h2>并发槽位</h2></div><span id="phases" class="pill">—</span></div><div id="slots" class="slots"></div></article>
      <article class="panel"><div class="panel-head"><div><p class="eyebrow">Live telemetry</p><h2>实时模型消耗</h2></div></div><dl><div><dt>估算成本</dt><dd id="cost">—</dd></div><div><dt>LLM 调用</dt><dd id="calls">—</dd></div><div><dt>输入 Tokens</dt><dd id="input">—</dd></div><div><dt>输出 Tokens</dt><dd id="output">—</dd></div><div><dt>缓存读取</dt><dd id="cache">—</dd></div><div><dt>缓存命中率</dt><dd id="cache-rate">—</dd></div></dl></article>
    </section>
    <section class="panel"><div class="panel-head"><div><p class="eyebrow">Latest results</p><h2>最近完成</h2></div></div><div class="table"><table><thead><tr><th>结果</th><th>任务</th><th>耗时</th><th>调用</th><th>成本</th></tr></thead><tbody id="recent"></tbody></table></div></section>
    <footer><span>每 5 秒刷新</span><span id="path"></span></footer>
  </main>
  <script src="/benchmark.js" defer></script>
</body>
</html>
