<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="module" content="agent_context">
  <link rel="stylesheet" href="../../visual/css/prompt.css">
  <script src="../../visual/js/prompt.js"></script>
</head>
<body>
<agent-context>
<task>
{{ task }}
</task>
{% if inherited_context %}
<inherited-context>
{{ inherited_context }}
</inherited-context>
{% endif %}
<constraints>
{{ constraint_text }}
</constraints>
<step-info>
{{ step_info }}
</step-info>
<memory>
{{ memory_context }}
</memory>
{% if environment_state %}
<environment-state>
{{ environment_state }}
</environment-state>
{% endif %}
{% if todo %}
<todo>
{{ todo }}
</todo>
{% endif %}
<workspace>
{{ workspace }}
</workspace>
{% if errors %}
<errors>
{{ errors }}
</errors>
{% endif %}</agent-context>
</body>
</html>
