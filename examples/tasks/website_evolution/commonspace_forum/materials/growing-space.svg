  <path d="M100 395V280Q215 280 215 395Z" fill="#e8d1aa" stroke="#986c43" stroke-width="2"/>
  <path d="M235 353H795" fill="none" stroke="#96a89a" stroke-width="56" stroke-dasharray="12 10"/>
