<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Godot playtest</title>
  <link rel="stylesheet" href="./play.css">
  <script type="module" src="./play.js"></script>
</head>
<body>
  <header><div><span class="eyebrow">PLAYTEST</span><h1 id="title">Godot playtest</h1></div>
    <div class="actions"><span id="status" role="status">Ready to connect</span>
      <button id="connect">Start playing</button><button id="fullscreen">Fullscreen</button></div>
  </header>
  <main id="screen" aria-label="Interactive game screen" tabindex="0"></main>
  <footer>Click the game to focus · Keyboard and mouse supported · Preview saves last until redeployment · Audio unavailable</footer>
</body>
</html>
