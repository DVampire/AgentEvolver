[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentevolver"
version = "0.1.0"
description = "A self-evolving multi-agent framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentEvolver" }]

# Core runtime dependencies — the single source of truth (formerly scripts/requirements.txt).
# Imported at package-import time or by the default capability set, so not optional.
# Heavier/rarely-used integrations live in [project.optional-dependencies] below.
dependencies = [
    # core framework
    "mmengine>=0.10.7",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "PyYAML",
    "inflection>=0.5.1",
    "asyncio-atexit>=1.0.1",
    "tenacity>=9.1.4",
    "rich",
    "pyte>=0.8.2",   # interprets a pty byte stream into the screen a person would see
    "diskcache>=5.6.3",
    "dirtyjson>=1.0.8",
    "json-repair",
    "jsonschema>=4.20.0",
    "sympy>=1.12.1",
    # http / networking / protocol
    "httpx>=0.28.1",
    "aiohttp>=3.13.3",
    "requests",
    "validators",
    "mcp",
    # `connector/context.py` imports `langchain_mcp_adapters` to reach an MCP server.
    # `mcp` alone does not bring it: it was present only because something else pulled it
    # in, so a clean install left every connector call failing on the import.
    "langchain-mcp-adapters",
    "crawl4ai>=0.8.6",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # llm providers
    "openai>=1.0.0",
    "anthropic>=0.116.0",
    "google-genai>=2.11.0",
    "google-cloud-vision>=3.13.0",
    "tiktoken>=0.12.0",
    # data / science
    "pandas>=2.0.0",
    "datasets>=2.0.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.2",
    "ipython>=8.0.0",
    # documents / parsing
    "markitdown>=0.1.5",
    "pypdf",
    "pdfminer.six>=20260107",
    "camelot-py>=1.0.9",
    "xlrd>=2.0.2",
    "lxml",
    "defusedxml",
    # `utils/screenshot_utils.py` imports PIL at module level, so this is not optional
    # the way the plugins' own imports are — it was present only transitively.
    "pillow",
    # secrets
    "hvac>=2.4.0",
]

[project.optional-dependencies]
browser = ["playwright", "browser-use[cli]"]   # browser automation environment
chem = ["rdkit"]                           # chemistry skills (rdkit)
sandbox = ["opensandbox", "opensandbox-server"]  # remote sandbox backend
benchmark = ["programbench"]               # ProgramBench task/eval data (examples/run_programbench.py)
observability = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
# Derived, not re-listed: adding a package to an extra above must not require
# remembering to add it here too. That is how "e2b" outlived its module in both.
all = ["agentevolver[browser,chem,sandbox,benchmark,observability]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.12"]

[tool.pytest.ini_options]
addopts = "-m 'not integration and not slow'"
testpaths = ["tests"]
norecursedirs = ["output", "node_modules", ".git", ".venv", "venv"]
markers = [
    "integration: requires external credentials, services, browsers, or containers",
    # Run explicitly with `pytest -m slow`. Each case mutates one source file and launches
    # a fresh pytest process; keeping that meta-gate out of the edit/test loop saves about
    # a minute while preserving it for CI or pre-release verification.
    "slow: reintroduces a defect in a subprocess to prove a gate still catches it",
]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["D100", "E4", "E7", "E9", "F", "I"]

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
# Not in `addopts`: measuring costs ~30% wall-clock on every run, and the gate that
# reads this data (tests/test_coverage_floor.py) only needs it refreshed when the
# floor is being checked. Produce it explicitly:
#
#     pytest --cov --cov-report=json --cov-report=term-missing
#
# What the numbers are *for*: a line no test reaches is either untested behaviour or
# dead code, and the two are told apart by reading it, not by the percentage. Several
# defects found by hand in this repo — a reward never written, a `forget()` with no
# call site, a `mutates` flag dropped in three registration paths — were all visible
# here as zero-coverage code before anyone read the file.
[tool.coverage.run]
source = ["agentevolver"]
# Subprocess coverage is deliberately not collected. The `slow` tests run a mutated
# checkout under a fresh interpreter to prove a gate goes red; measuring those would
# credit lines to a source tree that no longer matches the one on disk.
omit = [
    "*/__pycache__/*",
    "*/node_modules/*",
]

[tool.coverage.report]
# Every exclusion here is a line that *cannot* run in a test process, not a line we
# would rather not test. Anything else stays in the denominator on purpose.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
]
show_missing = true
skip_empty = true

[tool.coverage.json]
output = "output/.coverage.json"

[project.scripts]
agentevolver = "agentevolver.cli:main"

[tool.hatch.build.targets.wheel]
# Ship the whole package, including non-Python resources (prompts .html, visual .css/.js,
# bundled skills SKILL.md + scripts). Hatchling includes package data files by default.
packages = ["agentevolver"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the repo-root default configs into the installed package so they resolve when
# there is no source checkout. In an editable/source install they are still found at the
# repo root first (see agentevolver/paths.py resource search order).
"configs" = "agentevolver/configs"

[tool.hatch.build.targets.sdist]
include = ["agentevolver", "configs", "README.md"]
